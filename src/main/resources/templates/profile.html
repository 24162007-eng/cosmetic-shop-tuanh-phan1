<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trang cá nhân - Cosmetic Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container" style="min-height: 500px; margin-top: 40px;">
    <h1>Cosmetic Shop</h1>
    <div class="d-flex align-items-center gap-3 my-4">
        <img id="images" src="" alt="" width="100" height="100" style="object-fit: cover;">
        <div>
            <div id="fullName" class="fw-bold"></div>
            <div id="email"></div>
            <button id="logout" type="button" class="btn btn-outline-danger btn-sm mt-2">Đăng xuất</button>
        </div>
    </div>

    <h4>Danh sách sản phẩm</h4>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Tên</th>
            <th>Thương hiệu</th>
            <th>Loại</th>
            <th>Giá</th>
            <th>Tồn kho</th>
        </tr>
        </thead>
        <tbody id="productBody"></tbody>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
